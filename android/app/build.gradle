apply plugin: 'com.android.application'

// Sürüm numarası CI çalışma numarasından gelir: her derleme bir öncekinden büyük olur, böylece üstüne güncellenir.
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "com.koruk.iptv"
    // Yazılım ses çözücüsü (media3-ffmpeg-decoder) çekirdek kitaplık uyarlamasını (desugaring) şart koşar.
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    compileSdk rootProject.ext.compileSdkVersion
    // BuildConfig.PLAY: Google Play sürümünde true (distInfo ile arayüze bildirilir).
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.koruk.iptv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode runNumber
        versionName "1.0.${runNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Doğrudan dağıtılan APK her derlemede aynı anahtarla imzalanır; Android ancak aynı imzalı APK'yı mevcut uygulamanın üstüne günceller.
    signingConfigs {
        iptv {
            storeFile file('iptv.keystore')
            storePassword 'iptvplayer'
            keyAlias 'iptv'
            keyPassword 'iptvplayer'
        }
        // Google Play'e yüklenen paketin yükleme anahtarı. CI'de PLAY_KEYSTORE_* ortam değişkenleri (GitHub gizli değişkenleri) verilirse onlar
        // kullanılır; verilmezse şimdilik depodaki anahtar kullanılır. APK anahtarından ayrı tutulur: gizli değişkene geçmek APK güncellemesini bozmaz.
        upload {
            storeFile file(System.getenv('PLAY_KEYSTORE_FILE') ?: 'iptv.keystore')
            storePassword System.getenv('PLAY_KEYSTORE_PASSWORD') ?: 'iptvplayer'
            keyAlias System.getenv('PLAY_KEY_ALIAS') ?: 'iptv'
            keyPassword System.getenv('PLAY_KEY_PASSWORD') ?: 'iptvplayer'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.iptv
        }
        release {
            signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // direct: APK olarak doğrudan dağıtım (uygulama içi güncelleme, yönetici paneli, davet kodlu listeler, FFmpeg ses çözücüsü var).
    // play: Google Play paketi (bunların hiçbiri yok; güncellemeyi Play yapar).
    flavorDimensions "dist"
    productFlavors {
        direct {
            dimension "dist"
            buildConfigField "boolean", "PLAY", "false"
        }
        play {
            dimension "dist"
            buildConfigField "boolean", "PLAY", "true"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // TV eşleştirme QR kodunu okur (Google kod tarayıcısı: Play hizmetleri sağlar, kamera izni ve uygulama içi kamera kodu gerekmez)
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    // Yazılım ses çözücüsü (FFmpeg): cihazda çözücüsü olmayan AC3/E-AC3/DTS seslerini çalar. Jellyfin'in hazır derlemesi; sürümü
    // media3Version ile aynı tutulmalı ("+1" yapı numarasıdır). Lisansı GPLv3'tür; bu yüzden ve 16 KB sayfa şartını karşılamadığı için
    // yalnız doğrudan dağıtılan APK'da bulunur, Google Play paketine girmez (oynatıcı eklentiyi ada göre arar; yoksa yok sayar).
    directImplementation "org.jellyfin.media3:media3-ffmpeg-decoder:${media3Version}+1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation "androidx.tvprovider:tvprovider:1.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // Ağ paylaşımları: WebDAV/UPnP istekleri (OkHttp) ve SMB (jcifs-ng)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "eu.agno3.jcifs:jcifs-ng:2.1.10"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
