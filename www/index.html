<script>
// Açılışta bir betik hatası olursa sessiz kalmak yerine ekranda göster.
(function () {
  var hideTimer = 0;
  function show(msg) {
    var d = document.getElementById('diag');
    if (!d) {
      d = document.createElement('pre');
      d.id = 'diag';
      d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:12px;max-height:45%;overflow:auto;background:#3a1d22;color:#fecaca;font:12px/1.4 monospace;white-space:pre-wrap;cursor:pointer';
      d.title = 'Kapatmak için dokunun';
      d.addEventListener('click', function () { d.remove(); clearTimeout(hideTimer); });
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent += msg + '\n';
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (d.isConnected) d.remove(); }, 8000);
  }
  window.addEventListener('error', function (e) { show('Hata: ' + (e.message || 'bilinmeyen') + (e.filename ? '\n' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('Hata: ' + ((e.reason && e.reason.message) || e.reason)); });
})();
</script>

    <button data-tab="series"><svg class="ic"><use href="#i-series"/></svg><span>Dizi</span></button>
    <button data-tab="favs"><svg class="ic"><use href="#i-star-on"/></svg><span>Favoriler</span></button>
    <button data-tab="sources"><svg class="ic"><use href="#i-gear"/></svg><span>Ayarlar</span></button>
  </nav>
</div>

<div id="player" hidden>
  <video id="vid" playsinline></video>
  <div id="pl-ui" class="show">
    <div class="pl-top">
      <button id="pl-back" class="icon-btn" aria-label="Kapat"><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="pl-title"><b id="pl-name"></b><span id="pl-sub"></span></div>
      <button id="pl-fav" class="icon-btn" aria-label="Favori"><svg class="ic"><use href="#i-star"/></svg></button>
      <button id="pl-epg" class="icon-btn" aria-label="Program rehberi"><svg class="ic"><use href="#i-info"/></svg></button>
    </div>
    <div class="pl-mid">
      <button id="pl-prev" class="big-btn" aria-label="Önceki"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button id="pl-rew" class="big-btn sm" aria-label="10 sn geri"><svg class="ic"><use href="#i-rew"/></svg><i>10</i></button>
      <button id="pl-play" class="big-btn lg" aria-label="Oynat/Duraklat"><svg class="ic"><use href="#i-pause"/></svg></button>
      <button id="pl-fwd" class="big-btn sm" aria-label="10 sn ileri"><svg class="ic"><use href="#i-fwd"/></svg><i>10</i></button>
      <button id="pl-next" class="big-btn" aria-label="Sonraki"><svg class="ic"><use href="#i-next"/></svg></button>
    </div>
    <div class="pl-bot">
      <div id="pl-prog" class="pl-prog"><span id="pl-pos">0:00</span><input id="pl-seek" type="range" min="0" max="1000" value="0"><span id="pl-dur">0:00</span></div>
      <div id="pl-epgline" class="pl-epgline"></div>
      <div class="pl-tools">
        <button id="pl-audio" class="tool" hidden><svg class="ic"><use href="#i-audio"/></svg><span>Ses</span></button>
        <button id="pl-text" class="tool" hidden><svg class="ic"><use href="#i-cc"/></svg><span>Altyazı</span></button>
        <button id="pl-sync" class="tool" hidden><svg class="ic"><use href="#i-sync"/></svg><span id="pl-sync-l">Ses senkronu</span></button>
        <button id="pl-pip" class="tool" hidden aria-label="Resim içinde resim"><svg class="ic"><use href="#i-pip"/></svg></button>
        <button id="pl-external" class="tool" hidden><svg class="ic"><use href="#i-play"/></svg><span>Harici oynatıcı</span></button>
        <button id="pl-tv" class="tool" hidden><svg class="ic"><use href="#i-cast"/></svg><span>TV'de oynat</span></button>
        <button id="pl-dl" class="tool" hidden><svg class="ic"><use href="#i-dl"/></svg><span>İndir</span></button>
        <button id="pl-rec" class="tool" hidden><svg class="ic"><use href="#i-rec"/></svg><span id="pl-rec-l">Kaydet</span></button>
        <button id="pl-golive" class="tool" hidden><svg class="ic"><use href="#i-tv"/></svg><span>Canlıya dön</span></button>
        <button id="pl-last" class="tool" hidden><svg class="ic"><use href="#i-swap"/></svg><span>Son kanal</span></button>
        <button id="pl-stats" class="tool" aria-pressed="false"><svg class="ic"><use href="#i-activity"/></svg><span>Bilgi</span></button>
        <button id="pl-fix" class="tool" hidden><svg class="ic"><use href="#i-refresh"/></svg><span>Görüntü bozuk?</span></button>
        <button id="pl-night" class="tool" hidden aria-pressed="false"><svg class="ic"><use href="#i-moon"/></svg><span id="pl-night-l">Gece modu</span></button>
        <button id="pl-lock" class="tool" aria-label="Oynatıcıyı kilitle"><svg class="ic"><use href="#i-lock"/></svg><span>Kilitle</span></button>
        <button id="pl-sleep" class="tool"><svg class="ic"><use href="#i-timer"/></svg><span id="pl-sleep-l">Uyku</span></button>
        <button id="pl-aspect" class="tool"><svg class="ic"><use href="#i-aspect"/></svg><span id="pl-aspect-l">Sığdır</span></button>
      </div>
    </div>
  </div>
  <section id="pl-vod-shelf" class="pl-vod-shelf" hidden aria-label="Film önerileri ve dizi bölümleri">
    <h3 id="pl-vod-shelf-title">Önerilen filmler</h3>
    <div id="pl-vod-shelf-row" class="pl-vod-shelf-row"></div>
  </section>
  <section id="pl-epg-panel" class="pl-epg-panel" hidden aria-label="Yayın akışı">
    <div class="pl-epg-head"><div><b>Yayın akışı</b><small id="pl-epg-channel"></small></div><button id="pl-epg-remind" class="btn sm"><svg class="ic"><use href="#i-bell"/></svg> Hatırlat</button></div>
    <div id="pl-epg-programs" class="pl-epg-programs"><p class="hint">Program bilgisi yükleniyor…</p></div>
  </section>
  <div id="pl-num" class="pl-num" hidden aria-live="polite"></div>
  <div id="pl-nextup" class="pl-nextup" hidden><div class="nu-t"><span id="nu-h">Sonraki bölüm</span><b id="nu-name"></b></div><div class="nu-btns"><button id="nu-now" class="btn sm"><svg class="ic"><use href="#i-next"/></svg><span id="nu-l">Şimdi oynat · </span><span id="nu-s"></span></button><button id="nu-no" class="btn sm ghost">İptal</button></div></div>
  <button id="pl-intro" class="btn pl-intro" hidden><svg class="ic"><use href="#i-fwd"/></svg>Intro atla</button>
  <button id="pl-unlock" class="pl-unlock" hidden aria-label="Kilidi aç"><svg class="ic"><use href="#i-lock-open"/></svg><span>Kilitli · Açmak için dokunun</span></button>
  <div id="pl-stats-box" class="pl-stats" hidden></div>
  <div id="pl-hud" class="pl-hud" hidden><svg class="ic"><use href="#i-sun"/></svg><div class="hud-t"></div><div class="hud-bar"><i></i></div></div>
  <div id="pl-status" class="pl-status" hidden></div>
</div>

<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/hls.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
