name: Üyelik sunucusu

# Tek cihaz kuralının sunucusu (Cloudflare Workers, ücretsiz plan). Yalnız server/ değişince
# ya da elle çalıştırılınca dağıtılır. CLOUDFLARE_API_TOKEN tanımlı değilse sessizce atlanır.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dağıt
        working-directory: server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN tanımlı değil; dağıtım atlandı." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### Üyelik sunucusu yayında"
            echo
            echo "Adres: ${URL:-(günlükte bulunamadı; deploy.log adımına bakın)}"
          } >> "$GITHUB_STEP_SUMMARY"
