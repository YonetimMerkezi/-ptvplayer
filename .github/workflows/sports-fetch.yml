name: Spor sayfa örnekleri

# Geçici: TheSportsDB rozet aramasını ve görsel adreslerini gerçek sunucuda dener.
on:
  push:
    branches: [sports-fetch]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İndir
        run: |
          mkdir -p samples2
          : > samples2/status.txt
          q() {
            name="$1"
            f="samples2/tsdb-$(echo "$name" | tr -c 'A-Za-z0-9\n' '_').json"
            code=$(curl -sS -L -m 30 -o "$f" -w "%{http_code} %{size_download}" "https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=$2" 2>&1) || code="hata $code"
            echo "$name | $2 | $code" >> samples2/status.txt
          }
          q Galatasaray Galatasaray
          q Fenerbahce-tr "Fenerbah%C3%A7e"
          q Fenerbahce-ascii Fenerbahce
          q Besiktas-tr "Be%C5%9Fikta%C5%9F"
          q Besiktas-ascii Besiktas
          q Kepez "Kepez%20Bld."
          q Flamengo Flamengo
          q Hamburger "Hamburger%20SV"
          q Arsenal Arsenal
          q Bandirmaspor Bandirmaspor
          q Manisa Manisa%20FK
          q Karsiyaka Kar%C5%9F%C4%B1yaka
          q Karsiyaka-ascii Karsiyaka
          # rozet görseli: /small ve /tiny eki çalışıyor mu
          B=$(python3 - <<'PY'
          import json,glob
          d=json.load(open('samples2/tsdb-Arsenal.json'))
          print(d['teams'][0]['strBadge'])
          PY
          )
          echo "badge=$B" >> samples2/status.txt
          for suf in "" "/small" "/tiny"; do
            c=$(curl -sS -L -m 30 -o /dev/null -w "%{http_code} %{size_download} %{content_type}" "$B$suf" 2>&1) || c="hata"
            echo "badge$suf | $c" >> samples2/status.txt
          done
          c=$(curl -sS -L -m 30 -o /dev/null -w "%{http_code} %{size_download}" "https://flagcdn.com/w80/gb-wls.png" 2>&1); echo "flag wls | $c" >> samples2/status.txt
          cat samples2/status.txt
      - name: Kaydet
        run: |
          git config user.name "sports-fetch"
          git config user.email "sports-fetch@users.noreply.github.com"
          git add samples2
          git commit -m "TheSportsDB örnekleri" || true
          git push origin HEAD:sports-fetch
