name: APK derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Birim testleri
        run: npm test

      - name: Web dosyalarını hazırla ve Android'e aktar
        run: |
          npm run build:web
          npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-oynatici-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Sabit indirme bağlantısı: telefonda bu adresi açıp APK'yı eskisinin üstüne kurabilirsin.
      # https://github.com/${{ github.repository }}/releases/download/latest/iptv-oynatici.apk
      - name: Son sürümü yayınla
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk iptv-oynatici.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest iptv-oynatici.apk --target "${{ github.sha }}" --latest \
            --title "Son sürüm 1.0.${{ github.run_number }}" \
            --notes "Derleme ${{ github.run_number }} (${GITHUB_SHA::7}). Mevcut uygulamanın üstüne kurulur, kaldırmaya gerek yoktur."
