name: APK derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Aynı sabit 'latest' sürümünü iki workflow'un eşzamanlı yayımlamasını önle.
concurrency:
  group: iptv-latest-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Birim testleri
        run: npm test

      - name: Web dosyalarını hazırla ve Android'e aktar
        run: |
          npm run build:web
          npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven/Google depolarından kütüphane indirirken geçici ağ hataları olabiliyor; 3 kez denenir.
          for deneme in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "Derleme $deneme. denemede başarısız oldu; 20 sn sonra yeniden denenecek."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-oynatici-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Sabit indirme bağlantısı: telefonda bu adresi açıp APK'yı eskisinin üstüne kurabilirsin.
      # https://github.com/${{ github.repository }}/releases/download/latest/iptv-oynatici.apk
      - name: Son sürümü yayınla
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk iptv-oynatici.apk
          # Uygulama içi güncelleme bu dosyayı okur (www/js/update.js): numara gradle versionCode ile aynıdır.
          jq -n --argjson code "${{ github.run_number }}" --arg name "1.0.${{ github.run_number }}" \
            --argjson size "$(stat -c %s iptv-oynatici.apk)" --arg notes "$(cat notes.txt 2>/dev/null || echo "Derleme ${{ github.run_number }} (${GITHUB_SHA::7})")" \
            '{versionCode:$code, versionName:$name, size:$size, apk:"iptv-oynatici.apk", notes:$notes}' > version.json
          cat version.json
          TITLE="Son sürüm 1.0.${{ github.run_number }}"
          NOTES="Derleme ${{ github.run_number }} (${GITHUB_SHA::7}). Mevcut uygulamanın üstüne kurulur, kaldırmaya gerek yoktur."
          # Draft release kayıtları /releases/tags/latest uç noktasında görünmeyebilir.
          # Tüm release kayıtları içinde tag_name=latest olan kaydı bul.
          RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "latest") | .id' | head -n 1)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" -X PATCH \
              -f name="$TITLE" -f body="$NOTES" -F draft=false -F prerelease=false -f make_latest=true >/dev/null
            gh release upload latest iptv-oynatici.apk version.json --clobber
          else
            gh release create latest iptv-oynatici.apk version.json --target "${{ github.sha }}" --latest \
              --title "$TITLE" --notes "$NOTES"
          fie
            gh release create latest iptv-oynatici.apk version.json --target "${{ github.sha }}" --latest \
              --title "$TITLE" --notes "$NOTES"
          fi
