name: APK derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Aynı sabit 'latest' sürümünü iki workflow'un eşzamanlı yayımlamasını önle.
# Her dalın derlemesi bağımsız çalışır. PR derlemesi, main sürüm yayımını iptal etmemeli.
concurrency:
  group: iptv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Birim testleri
        run: npm test

      - name: Web dosyalarını hazırla ve Android'e aktar
        run: |
          npm run build:web
          npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven/Google depolarından kütüphane indirirken geçici ağ hataları olabiliyor; 3 kez denenir.
          for deneme in 1 2 3; do
            ./gradlew assembleDirectDebug --no-daemon --stacktrace && exit 0
            echo "Derleme $deneme. denemede başarısız oldu; 20 sn sonra yeniden denenecek."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-oynatici-debug-apk
          path: android/app/build/outputs/apk/direct/debug/app-direct-debug.apk
          if-no-files-found: error

      # Sabit indirme bağlantısı: telefonda bu adresi açıp APK'yı eskisinin üstüne kurabilirsin.
      # https://github.com/${{ github.repository }}/releases/download/latest/iptv-oynatici.apk
      - name: Son sürümü yayınla
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/direct/debug/app-direct-debug.apk iptv-oynatici.apk
          # Uygulama içi güncelleme bu dosyayı okur (www/js/update.js): numara gradle versionCode ile aynıdır.
          jq -n --argjson code "${{ github.run_number }}" --arg name "1.0.${{ github.run_number }}" \
            --argjson size "$(stat -c %s iptv-oynatici.apk)" --arg notes "$(cat notes.txt 2>/dev/null || echo "Derleme ${{ github.run_number }} (${GITHUB_SHA::7})")" \
            '{versionCode:$code, versionName:$name, size:$size, apk:"iptv-oynatici.apk", notes:$notes}' > version.json
          cat version.json
          TITLE="Son sürüm 1.0.${{ github.run_number }}"
          CHANGE_NOTES="$(cat notes.txt 2>/dev/null || echo "Bu sürümde hata düzeltmeleri ve iyileştirmeler yapıldı.")"
          NOTES="$(printf '%s\n\nDerleme %s (%s). Mevcut uygulamanın üstüne kurulur, kaldırmaya gerek yoktur.' "$CHANGE_NOTES" "${{ github.run_number }}" "${GITHUB_SHA::7}")"
          # Draft release kayıtları /releases/tags/latest uç noktasında görünmeyebilir.
          # Tüm release kayıtları içinde tag_name=latest olan kaydı bul.
          RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "latest") | .id' | head -n 1)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" -X PATCH \
              -f name="$TITLE" -f body="$NOTES" -F draft=false -F prerelease=false -f make_latest=true >/dev/null
            gh release upload latest iptv-oynatici.apk version.json --clobber
          else
            gh release create latest iptv-oynatici.apk version.json --target "${{ github.sha }}" --latest \
              --title "$TITLE" --notes "$NOTES"
          fi

  # Google Play paketi (AAB): FFmpeg, uygulama içi güncelleme, yönetici paneli ve kurulum izni olmadan. Ayrı iş olduğundan burada bir hata
  # APK yayınını engellemez. Paketi Play Console'a elle yükle: Actions > bu çalışma > iptv-play-aab.
  # Yükleme anahtarı: GitHub gizli değişkenleri PLAY_KEYSTORE_BASE64, PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS, PLAY_KEY_PASSWORD verilirse
  # onlarla, verilmezse şimdilik depodaki anahtarla imzalanır.
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Web dosyalarını hazırla ve Android'e aktar
        run: |
          npm run build:web
          npx cap sync android

      - name: Yükleme anahtarı (gizli değişken verilmişse)
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_KEYSTORE_BASE64" ]; then
            echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "PLAY_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          fi

      - name: Play paketini (AAB) derle
        working-directory: android
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          for deneme in 1 2 3; do
            ./gradlew bundlePlayRelease --no-daemon --stacktrace && exit 0
            echo "Derleme $deneme. denemede başarısız oldu; 20 sn sonra yeniden denenecek."
            sleep 20
          done
          exit 1

      # Play paketinde olmaması gerekenler girmiş mi: girdiyse iş kırmızı olur. Sonuç özeti iş ek açıklamalarında görünür.
      - name: Paketin içini doğrula
        run: |
          python3 - <<'EOF'
          import zipfile, sys
          f = 'android/app/build/outputs/bundle/playRelease/app-play-release.aab'
          z = zipfile.ZipFile(f)
          names = z.namelist()
          so = [n for n in names if n.endswith('.so')]
          manifest = z.read('base/manifest/AndroidManifest.xml')
          perm = b'REQUEST_INSTALL_PACKAGES' in manifest
          dex = [z.read(n) for n in names if n.endswith('.dex')]
          pkg = any(b'application/vnd.android.package-archive' in d for d in dex)
          ffmpeg = any(b'ffmpeg' in n.lower() for n in so)
          print(f'::notice title=AAB::boyut={len(open(f, "rb").read())} yerel_kitaplik={so} kurulum_izni={perm} apk_kurma_dizesi={pkg}')
          bad = []
          if perm: bad.append('REQUEST_INSTALL_PACKAGES izni Play paketinde olmamalı')
          if ffmpeg: bad.append('FFmpeg yerel kitaplığı Play paketinde olmamalı')
          if pkg: bad.append('APK kurma kodu Play paketinde olmamalı')
          if bad:
              for b in bad: print('::error::' + b)
              sys.exit(1)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-play-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      # Telefondan indirmek için: Play paketi (AAB, zip'siz tek dosya) ve mağaza görselleri (play/graphics, play-gorselleri.zip) "play" adlı ön sürüm kaydına da konur. "latest" kaydına dokunmaz:
      # uygulama içi güncelleme yalnız onu okur. Her çalışmada üzerine yazılır; sürüm numarası çalışma numarasıdır (Play her yüklemede artan ister).
      - name: Play paketini yayınla
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab iptv-play.aab
          (cd play/graphics && zip -q -r -0 ../../play-gorselleri.zip .)
          TITLE="Google Play paketi 1.0.${{ github.run_number }}"
          NOTES="Play Console'a yüklenecek paket (AAB). Telefona kurulmaz. Mağaza görselleri play-gorselleri.zip içindedir. Sürüm kodu ${{ github.run_number }} (${GITHUB_SHA::7})."
          RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "play") | .id' | head -n 1)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" -X PATCH \
              -f name="$TITLE" -f body="$NOTES" -F draft=false -F prerelease=true >/dev/null
            gh release upload play iptv-play.aab play-gorselleri.zip --clobber
          else
            gh release create play iptv-play.aab play-gorselleri.zip --target "${{ github.sha }}" --prerelease \
              --title "$TITLE" --notes "$NOTES"
          fi
