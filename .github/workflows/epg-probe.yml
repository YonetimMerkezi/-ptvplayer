name: EPG kaynak testi

# Ücretsiz TV rehberi kaynaklarını sunucu tarafında dener; sonuç ve ham örnekler 'epg-data' dalına yazılır (APK derlemesi tetiklenmez: derleme yalnız main'de).
on:
  push:
    branches: [main]
    paths:
      - scripts/epg-probe.mjs
      - .github/workflows/epg-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kaynakları dene
        run: node scripts/epg-probe.mjs epg-out
      - name: epg-data dalına yaz
        run: |
          cd epg-out
          git init -q -b epg-data
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "EPG kaynak testi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" epg-data
