name: EPG tanı
on:
  push:
    branches: [epg-diag]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sayfaları indir
        run: |
          mkdir out
          UA='Mozilla/5.0 (Linux; Android 11; TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36'
          get() { curl -sS -L -m 60 -A "$UA" -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 HATA"; }
          get diziler-bugun.html https://tvdebugun.net/bugun-hangi-diziler-var/
          get film-bugun.html https://tvdebugun.net/bugun-hangi-film-var/
          get diziler-cuma.html https://tvdebugun.net/cuma-hangi-diziler-var/
          get program-mehmed.html https://tvdebugun.net/program/mehmed-fetihler-sultani/
          get kanal-trt1.html https://tvdebugun.net/trt-1-yayin-akisi/
      - name: Teleonline ülke dağılımı
        run: |
          curl -sS -L -m 120 -o t.xml.gz https://teleonline.github.io/epg/epg.xml.gz
          gunzip -c t.xml.gz > t.xml
          grep -o '<channel id="[^"]*" country="[^"]*"' t.xml | sed 's/.*country="//; s/"//' | sort | uniq -c | sort -rn > out/teleonline-ulkeler.txt
          grep -io '<display-name>\(TRT\|ATV\|Kanal D\|Show TV\|Star TV\|TV8\|NTV\|CNN T\)[^<]*' t.xml | head -40 > out/teleonline-turk-adlar.txt || true
          wc -c t.xml out/* | tee out/boyutlar.txt
      - name: Dala yaz
        working-directory: out
        run: |
          git init -q -b epg-diag-out
          git config user.name epg-bot
          git config user.email epg-bot@users.noreply.github.com
          git add -A
          git commit -q -m "tanı"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" epg-diag-out
